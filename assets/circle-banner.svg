<title id="title">CIRCLE — Saling jaga, tetap terhubung</title><desc id="desc">Identitas ungu CIRCLE dengan ilustrasi peta, anggota circle, dan kontrol berbagi secara sukarela.</desc>
<defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ddd6f5" stroke-width="1"/></pattern></defs>
