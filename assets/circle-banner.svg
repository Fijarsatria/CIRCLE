<text x="58" y="176" font-size="49" font-weight="700" letter-spacing="-1.5" fill="#1a1c1b">Saling jaga.</text><text x="58" y="234" font-size="49" font-weight="700" letter-spacing="-1.5" fill="#6552d9">Tetap terhubung.</text>
<text x="60" y="280" font-size="19" fill="#5e5d69">Peta, kabar, dan orang terdekat. Kendali ada di kamu.</text>
